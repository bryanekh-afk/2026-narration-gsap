<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet GSAP</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <!-- Section 1 --------------- -->
    <section id="RMsection1">

        <h1>Rick and Morty</h1>
        <p class="sous-titre">UNE AVENTURE COSMO-BORDÉLIQUE !</p>
        <img id="vaisseau" src="assets/images/vaisseau.png" alt="vaisseau Rick and Morty">
    </section>

    <!-- Section 2 --------------- -->
<section id="section2" class="h100 bg-light">

    <img id="movingBlock2" src="assets/images/Portail.png" alt="Vaisseau animé" class="image-block">
</section>

<!-- Les 3 nouvelles images à rendre draggable -->
    <img id="drag1" src="assets/images/canetterouge.png" alt="canetterouge" class="mes-images-drag">
    <img id="drag2" src="assets/images/canettebleu.png" alt="canettebleu" class="mes-images-drag">
    <img id="drag3" src="assets/images/monstretête.png" alt="monstretête" class="mes-images-drag">
</section>






<!-- Section 3--------------- -->

<section id="section4" class="h100 bg-dark">
    <img id="movingBlock4" src="assets/images/vaisseau.png" alt="Image animée" class="image-block">
</section>


<!-- script ------------- -->

<!-- GSAP -->

    <script src="js/GSAP/gsap.min.js"></script>

    <script src="js/GSAP/Draggable.min.js"></script>

    <script src="js/GSAP/MotionPathPlugin.min.js"></script>

    <script src="js/GSAP/ScrollToPlugin.min.js"></script>

    <script src="js/GSAP/ScrollTrigger.min.js"></script>

    <script src="js/GSAP/InertiaPlugin.min.js"></script>

    

    <!-- main -->

    <script src="js/main.js"></script>

</section>
</body>
</html>
